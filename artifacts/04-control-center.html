<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiquidLens — Control Center</title>
<style>
/* ===== tokens.css ===== */
/*!
 * LiquidLens — tokens.css
 * Design tokens for the Liquid Glass system. Import BEFORE liquid-glass.css.
 * Override any of these on :root (or a scope) to re-theme without touching the engine.
 */
:root {
  /* ---- material parameters (mirror the JS defaults; JS updates the live ones) ---- */
  --lg-blur: 3px;            /* backdrop blur */
  --lg-sat: 1.8;             /* backdrop saturation */
  --lg-spec: 0.9;            /* specular intensity 0..1.5 */
  --lg-tint-h: 220;          /* tint hue */
  --lg-tint-s: 40%;          /* tint saturation */
  --lg-tint-l: 70%;          /* tint lightness */
  --lg-tint-a: 0.10;         /* tint alpha */

  /* ---- dynamic (written by the engine at runtime) ---- */
  --lg-lx: 32%;              /* specular light x */
  --lg-ly: 12%;              /* specular light y */
  --lg-edge: 140deg;         /* rim sweep angle */

  /* ---- shape ---- */
  --lg-radius: 28px;         /* default corner radius */
  --lg-radius-sm: 16px;
  --lg-radius-lg: 40px;
  --lg-radius-pill: 999px;

  /* ---- depth (adaptive shadow + inner light) ---- */
  --lg-shadow-drop: 0 12px 34px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.20);
  --lg-shadow-inner: 0 1px 1px rgba(255,255,255,.35) inset, 0 -1px 1px rgba(255,255,255,.10) inset;

  /* ---- chromatic edge (fake dispersion) ---- */
  --lg-chroma-cool: rgba(120,180,255,.20);
  --lg-chroma-warm: rgba(255,120,200,.18);

  /* ---- spacing scale (for building demos consistently) ---- */
  --lg-space-1: 6px;  --lg-space-2: 10px; --lg-space-3: 14px;
  --lg-space-4: 18px; --lg-space-5: 24px; --lg-space-6: 34px;

  /* ---- type ---- */
  --lg-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --lg-fg: #fff;             /* foreground on glass (keep high-contrast) */
  --lg-fg-dim: rgba(255,255,255,.7);

  /* ---- motion ---- */
  --lg-ease: cubic-bezier(.2, 1, .3, 1);   /* springy Apple-ish easing */
  --lg-dur: .35s;
}

/* A conventional "dark environment" scope (optional). */
[data-lg-env="dark"] {
  --lg-tint-l: 55%;
  --lg-tint-a: 0.12;
  --lg-shadow-drop: 0 14px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
}

/* ===== liquid-glass.css ===== */
/*!
 * LiquidLens — liquid-glass.css (the visual layers of the material)
 * Import order:  tokens.css  →  liquid-glass.css  →  your styles.
 * Pair with liquid-glass.js (it injects the refraction backdrop-filter).
 *
 * MATERIAL ANATOMY (bottom → top), see docs/03-material-anatomy.md
 *   backdrop-filter : blur + saturate + url(#displacement)   ← engine = refraction
 *   background      : hsla tint                              ← environment color
 *   ::after         : moving specular highlight (pointer / tilt)
 *   ::before        : specular rim + chromatic aberration
 *   box-shadow      : inner light + adaptive drop shadow (depth)
 *   > *             : your content, lifted above the glass layers
 */

/* ============ THE MATERIAL ============ */
.lg-glass {
  position: relative;
  border-radius: var(--lg-radius);
  color: var(--lg-fg);
  font-family: var(--lg-font);
  background: hsla(var(--lg-tint-h), var(--lg-tint-s), var(--lg-tint-l), var(--lg-tint-a));
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-sat));
          backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-sat));
  box-shadow: var(--lg-shadow-inner), var(--lg-shadow-drop);
  isolation: isolate;
  transition: transform var(--lg-dur) var(--lg-ease), box-shadow var(--lg-dur) ease, background .3s ease;
  will-change: transform;
}

/* Specular rim + subtle chromatic aberration along the edge */
.lg-glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  padding: 1px; z-index: 2;
  background: linear-gradient(var(--lg-edge),
      rgba(255,255,255,calc(.9 * var(--lg-spec))) 0%,
      rgba(255,255,255,.05) 22%,
      rgba(255,255,255,0) 50%,
      rgba(255,255,255,.05) 78%,
      rgba(255,255,255,calc(.55 * var(--lg-spec))) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  box-shadow:
    inset 0 0 0 .5px rgba(255,255,255,.25),
    inset 1px 1px 6px var(--lg-chroma-cool),
    inset -1px -1px 6px var(--lg-chroma-warm);
}

/* Moving specular highlight — reacts to pointer / device motion */
.lg-glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background: radial-gradient(70% 55% at var(--lg-lx) var(--lg-ly),
      rgba(255,255,255,calc(.55 * var(--lg-spec))) 0%,
      rgba(255,255,255,.06) 35%,
      rgba(255,255,255,0) 60%);
  mix-blend-mode: screen;
  transition: background .12s linear;
}

.lg-glass > * { position: relative; z-index: 3; }

/* ============ CLEAR VARIANT ============ */
.lg-clear {
  background: hsla(var(--lg-tint-h), 30%, 60%, calc(var(--lg-tint-a) * .35));
  -webkit-backdrop-filter: blur(1px) saturate(1.4);
          backdrop-filter: blur(1px) saturate(1.4);
}
.lg-scrim {
  position: absolute; inset: 0; border-radius: inherit; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.10));
}

/* ============ TINT HELPERS (semantic, subtle) ============ */
.lg-tint-blue   { --lg-tint-h: 212; --lg-tint-a: .16; }
.lg-tint-green  { --lg-tint-h: 145; --lg-tint-a: .16; }
.lg-tint-red    { --lg-tint-h: 2;   --lg-tint-a: .16; }
.lg-tint-purple { --lg-tint-h: 275; --lg-tint-a: .16; }
.lg-tint-amber  { --lg-tint-h: 38;  --lg-tint-a: .18; }

/* ============ SHAPE HELPERS ============ */
.lg-pill   { --lg-radius: var(--lg-radius-pill); }
.lg-circle { --lg-radius: 50%; aspect-ratio: 1; }
.lg-sm     { --lg-radius: var(--lg-radius-sm); }
.lg-lg     { --lg-radius: var(--lg-radius-lg); }

/* ============ COMPONENT PRIMITIVES ============ */
.lg-btn {
  --lg-radius: 22px; display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 24px; font: 600 16px/1 var(--lg-font); border: none; color: var(--lg-fg); cursor: pointer;
}
.lg-toolbar { display: inline-flex; gap: 12px; padding: 10px 14px; align-items: center; --lg-radius: 26px; }
.lg-card    { padding: var(--lg-space-5); --lg-radius: 30px; }

/* ============ INTERACTION ============ */
.lg-press { cursor: pointer; }
.lg-press:active { transform: scale(.96); }
.lg-press:active::after {
  background: radial-gradient(70% 60% at 50% 50%,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 45%, rgba(255,255,255,0) 70%);
}
/* Interactive glow that lifts on hover (subtle) */
.lg-interactive { transition: transform var(--lg-dur) var(--lg-ease), box-shadow var(--lg-dur) ease; }
.lg-interactive:hover { transform: translateY(-2px); }

/* ============ MORPH CONTAINER (glass elements that flow together) ============ */
.lg-morph { display: inline-flex; gap: 10px; }
.lg-morph > .lg-glass { transition: all var(--lg-dur) var(--lg-ease); }

/* ============ ACCESSIBILITY (mirrors Apple's automatic adaptation) ============ */
@media (prefers-reduced-transparency: reduce) {
  .lg-glass {
    background: rgba(28, 28, 36, .9);
    -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .lg-glass::before, .lg-glass::after { display: none; }
  .lg-clear { background: rgba(28, 28, 36, .82); }
}
@media (prefers-contrast: more) {
  .lg-glass { box-shadow: var(--lg-shadow-inner), var(--lg-shadow-drop), inset 0 0 0 1px rgba(255,255,255,.6); }
}
@media (prefers-reduced-motion: reduce) {
  .lg-glass, .lg-glass::after, .lg-interactive { transition: none; }
}

/* ===== shared ===== */

*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;font-family:var(--lg-font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow:hidden}
.sw{width:52px;height:32px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;cursor:pointer;transition:background .35s var(--lg-ease);flex:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .35s var(--lg-ease)}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}

/* ===== artifact ===== */

#bg{position:fixed;inset:0;z-index:0;
 background:
  radial-gradient(900px 700px at 20% 15%, #ff9a9e 0%, rgba(255,154,158,0) 55%),
  radial-gradient(900px 800px at 85% 20%, #a18cd1 0%, rgba(161,140,209,0) 55%),
  radial-gradient(1000px 900px at 75% 95%, #fbc2eb 0%, rgba(251,194,235,0) 55%),
  radial-gradient(900px 800px at 10% 90%, #8fd3f4 0%, rgba(143,211,244,0) 55%),
  linear-gradient(150deg,#4b1248,#84306f 50%,#c86dd7 100%);}
.wall{position:fixed;inset:0;z-index:0;background-image:
  linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:44px 44px;opacity:.5;mask-image:radial-gradient(120% 100% at 50% 0%,#000,transparent)}
.cc{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:28px}
.grid{width:430px;max-width:94vw;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:96px;gap:14px}
.head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:2px;padding:0 4px}
.head .t{font-size:20px;font-weight:800;letter-spacing:-.01em}
.head .s{font-size:13px;color:var(--lg-fg-dim)}
.mod{padding:14px}
.conn{grid-column:1/3;grid-row:span 2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:16px}
.cbtn{border-radius:999px;display:flex;align-items:center;gap:9px;padding:0 6px;cursor:pointer;color:#fff;font-size:13px;font-weight:600;
 background:rgba(255,255,255,.14);transition:background .3s var(--lg-ease)}
.cbtn .d{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.16);flex:none;transition:background .3s var(--lg-ease)}
.cbtn.on{background:rgba(255,255,255,.16)}
.cbtn.on .d{color:#fff}
.cbtn.b-air.on .d{background:#ff9f0a}
.cbtn.b-wifi.on .d{background:#0a84ff}
.cbtn.b-cell.on .d{background:#34c759}
.cbtn.b-bt.on .d{background:#0a84ff}
.music{grid-column:3/5;grid-row:span 1;display:flex;align-items:center;gap:12px;padding:12px 14px}
.music .cov{width:46px;height:46px;border-radius:10px;flex:none;background:linear-gradient(135deg,#ff6a88,#a18cd1);box-shadow:0 4px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:22px}
.music .info{flex:1;min-width:0}
.music .info .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .info .a{font-size:12px;color:var(--lg-fg-dim)}
.music .ctrls{display:flex;gap:12px;font-size:18px}
.music .ctrls span{cursor:pointer}
.tile{grid-column:span 1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13px;color:var(--lg-fg-dim);font-weight:600}
.tile .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.14);transition:background .3s var(--lg-ease),color .3s}
.tile.on .ic{background:#fff;color:#111}
.tile.on{color:#fff}
.slider{grid-column:span 1;grid-row:span 2;position:relative;overflow:hidden;cursor:pointer;touch-action:none}
.slider .sfill{position:absolute;left:0;right:0;bottom:0;height:62%;background:rgba(255,255,255,.92);transition:height .05s linear}
.slider .sic{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:22px;color:#111;z-index:4;mix-blend-mode:normal}
.brightness{grid-column:3/4}
.volume{grid-column:4/5}

</style>

 *   <div class="lg-glass" data-glass style="--lg-radius:28px;padding:24px">Hi</div>
 *   <script src="liquid-glass.js"><\/script>

 *   applyAll()          Re-apply to every [data-glass] element.
 *   set(partial)        Merge params into global state, update CSS vars, re-render. For live controls.

 *   destroy()           Remove observers/listeners and injected filters.
 *   state               Current global params.
 *   makeDisplacementMap(w,h,radius,bezel) -> dataURL  (advanced / testing)

 *   Edge = convex squircle  height(x) = (1 - (1-x)^4)^(1/4).
 *   Across the bezel: slope -> incidence angle -> Snell (air n=1 -> glass n=1.5)

 *   Encoded into R (x) / G (y) channels (128 = none). feDisplacementMap then

    return window.matchMedia && window.matchMedia('(prefers-reduced-transparency: reduce)').matches;
  }

  /* ---- apply the material to a single element ---- */
  function apply(el, opts) {
    if (reducedTransparency()) return; // CSS provides an opaque fallback; skip GPU work
    ensureRoot();
    var ds = el.dataset || {};
    var o = assign({}, state, opts, {
      refraction: num(ds.lgRefraction, (opts && opts.refraction) != null ? opts.refraction : state.refraction),
      bezel:      num(ds.lgBezel,      (opts && opts.bezel)      != null ? opts.bezel      : state.bezel),
      blur:       num(ds.lgBlur,       (opts && opts.blur)       != null ? opts.blur       : state.blur),
      saturation: num(ds.lgSaturation, (opts && opts.saturation) != null ? opts.saturation : state.saturation)
    });
    var rect = el.getBoundingClientRect();
    var w = Math.round(rect.width), h = Math.round(rect.height);
    if (w < 4 || h < 4) return;
    var isClear = el.classList.contains('lg-clear') || ds.glassVariant === 'clear';
    var radius = Math.min(radiusOf(el), Math.min(w, h) / 2);
    var bezel = Math.min(o.bezel, Math.min(w, h) / 2 - 1);
    var scale = isClear ? o.refraction * 0.5 : o.refraction;

    var id = ds.lgId; if (!id) { id = 'lg' + (uid++); el.dataset.lgId = id; }
    var map = makeDisplacementMap(w, h, radius, Math.max(2, bezel));

    var f = document.getElementById(id); if (f) f.remove();
    f = document.createElementNS(NS, 'filter');
    f.setAttribute('id', id);
    f.setAttribute('color-interpolation-filters', 'sRGB');
    f.setAttribute('x', '0'); f.setAttribute('y', '0');
    f.setAttribute('width', '100%'); f.setAttribute('height', '100%');
    f.innerHTML =
      '<feImage href="' + map + '" x="0" y="0" width="' + w + '" height="' + h + '" preserveAspectRatio="none" result="m"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="m" scale="' + scale + '" xChannelSelector="R" yChannelSelector="G"/>';
    filterRoot.appendChild(f);

    var blur = isClear ? Math.min(o.blur, 2) : o.blur;
    var sat = isClear ? 1.4 : o.saturation;
    var fx = 'blur(' + blur + 'px) saturate(' + sat + ') url(#' + id + ')';
    el.style.webkitBackdropFilter = fx;
    el.style.backdropFilter = fx;
  }
  function refresh(el) { apply(el); }

  function setVars() {
    var r = document.documentElement.style;
    r.setProperty('--lg-blur', state.blur + 'px');
    r.setProperty('--lg-sat', state.saturation);
    r.setProperty('--lg-spec', state.specular);
    r.setProperty('--lg-tint-h', state.tintHue);
    r.setProperty('--lg-tint-a', state.tintOpacity);
  }

  var raf = null;
  function applyAll() { var list = document.querySelectorAll('[data-glass]'); for (var i = 0; i < list.length; i++) apply(list[i]); }
  function schedule() { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(applyAll); }
  function set(partial) { assign(state, partial); setVars(); schedule(); }

  var pointerBound = false;
  function onPointer(e) {
    var r = document.documentElement.style;
    r.setProperty('--lg-lx', (e.clientX / innerWidth * 100).toFixed(1) + '%');
    r.setProperty('--lg-ly', (e.clientY / innerHeight * 100).toFixed(1) + '%');
    r.setProperty('--lg-edge', (90 + (e.clientX / innerWidth - 0.5) * 80).toFixed(0) + 'deg');
  }
  function onTilt(e) {
    var r = document.documentElement.style;
    var gx = clamp((e.gamma || 0) / 45, -1, 1), gy = clamp((e.beta || 0) / 45, -1, 1);
    r.setProperty('--lg-lx', (50 + gx * 40).toFixed(1) + '%');
    r.setProperty('--lg-ly', (30 + gy * 40).toFixed(1) + '%');
  }
  function bindMotion() {
    if (pointerBound) return; pointerBound = true;
    window.addEventListener('pointermove', onPointer);
    if (state.tilt && window.DeviceOrientationEvent) window.addEventListener('deviceorientation', onTilt);
  }

  function init(opts) {
    assign(state, opts); setVars(); bindMotion();
    var run = function () { applyAll(); setTimeout(applyAll, 150); };
    if (document.readyState === 'complete') run(); else window.addEventListener('load', run);
    window.addEventListener('resize', schedule);
    if ('ResizeObserver' in window) {
      var ro = new ResizeObserver(schedule); observers.push(ro);
      var list = document.querySelectorAll('[data-glass]');
      for (var i = 0; i < list.length; i++) ro.observe(list[i]);
    }
    if ('MutationObserver' in window) {
      var mo = new MutationObserver(function (muts) {
        for (var j = 0; j < muts.length; j++) {
          var added = muts[j].addedNodes;
          for (var k = 0; k < added.length; k++) {
            var node = added[k];
            if (node.nodeType === 1 && (node.matches && node.matches('[data-glass]'))) { apply(node); }
          }
        }
      });
      mo.observe(document.body, { childList: true, subtree: true }); observers.push(mo);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    return api;
  }

  function destroy() {
    for (var i = 0; i < observers.length; i++) observers[i].disconnect();
    observers = [];
    window.removeEventListener('pointermove', onPointer);
    window.removeEventListener('deviceorientation', onTilt);
    if (filterRoot) { filterRoot.remove(); filterRoot = null; }
    pointerBound = false;
  }

  var api = {
    init: init, apply: apply, applyAll: applyAll, set: set, refresh: refresh,
    destroy: destroy, state: state, makeDisplacementMap: makeDisplacementMap, _defaults: defaults
  };
  return api;
});

</script>
<script>

LiquidGlass.init({ refraction:18, bezel:22, blur:3, saturation:1.8, specular:0.95, tintHue:250, tintOpacity:0.12 });

document.querySelectorAll('[data-toggle]').forEach(function(t){
  t.addEventListener('click',function(){ t.classList.toggle('on'); });
});
var ccplay=document.getElementById('ccplay'),pl=true;
ccplay.addEventListener('click',function(e){ e.stopPropagation(); pl=!pl; ccplay.innerHTML = pl?'\u23F8':'\u25B6'; });

document.querySelectorAll('.slider').forEach(function(sl){
  var fill=sl.querySelector('.sfill'), down=false;
  function set(e){
    var r=sl.getBoundingClientRect();
    var p=Math.max(0.03,Math.min(1,(r.bottom-e.clientY)/r.height));
    fill.style.height=(p*100)+'%';
  }
  sl.addEventListener('pointerdown',function(e){down=true;sl.setPointerCapture(e.pointerId);set(e);});
  sl.addEventListener('pointermove',function(e){if(down)set(e);});
  sl.addEventListener('pointerup',function(){down=false;});
  sl.addEventListener('pointercancel',function(){down=false;});
});

</script>
