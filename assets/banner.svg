<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#160a33"/>
      <stop offset=".55" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#03122e"/>
    </linearGradient>
    <radialGradient id="g1" cx=".16" cy=".2" r=".5"><stop offset="0" stop-color="#ff5ea8" stop-opacity=".9"/><stop offset="1" stop-color="#ff5ea8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".85" cy=".18" r=".5"><stop offset="0" stop-color="#ffd36e" stop-opacity=".8"/><stop offset="1" stop-color="#ffd36e" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx=".8" cy=".9" r=".55"><stop offset="0" stop-color="#2bd6ff" stop-opacity=".8"/><stop offset="1" stop-color="#2bd6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g4" cx=".2" cy=".95" r=".55"><stop offset="0" stop-color="#7a5cff" stop-opacity=".85"/><stop offset="1" stop-color="#7a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lens" cx=".4" cy=".33" r=".85">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".65"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1280" height="440" fill="url(#sky)"/>
  <rect width="1280" height="440" fill="url(#g1)"/>
  <rect width="1280" height="440" fill="url(#g2)"/>
  <rect width="1280" height="440" fill="url(#g3)"/>
  <rect width="1280" height="440" fill="url(#g4)"/>

  <!-- giant faint word behind the glass -->
  <text x="60" y="330" font-family="-apple-system, SF Pro Display, Segoe UI, Arial" font-weight="800" font-size="240" fill="#fff" fill-opacity=".07" letter-spacing="-8">GLASS</text>

  <!-- floating glass card (refraction motif) -->
  <g transform="translate(720,96)">
    <rect x="0" y="0" width="470" height="250" rx="46" fill="url(#lens)"/>
    <rect x="0" y="0" width="470" height="250" rx="46" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <ellipse cx="120" cy="60" rx="120" ry="42" fill="#fff" opacity=".28" filter="url(#blur2)"/>
    <!-- pill + circle controls inside -->
    <rect x="40" y="150" width="230" height="56" rx="28" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="330" cy="178" r="28" fill="#2b8bff" fill-opacity=".9"/>
    <circle cx="404" cy="178" r="28" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".3"/>
  </g>

  <!-- lens droplet -->
  <g transform="translate(70,70)">
    <circle cx="70" cy="70" r="70" fill="url(#lens)"/>
    <circle cx="70" cy="70" r="70" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <ellipse cx="52" cy="48" rx="26" ry="15" fill="#fff" opacity=".55" filter="url(#blur2)"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="70" y="240" font-family="-apple-system, SF Pro Display, Segoe UI, Arial" font-weight="800" font-size="86" fill="#fff" letter-spacing="-2">LiquidLens</text>
  <text x="74" y="288" font-family="-apple-system, SF Pro Text, Segoe UI, Arial" font-weight="500" font-size="27" fill="#fff" fill-opacity=".82">Apple Liquid Glass — for every platform.</text>
  <text x="74" y="330" font-family="-apple-system, SF Pro Text, Segoe UI, Arial" font-weight="600" font-size="18" fill="#fff" fill-opacity=".6">Web · React · React Native · Flutter · SwiftUI</text>
</svg>
