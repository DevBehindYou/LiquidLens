<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none" font-family="-apple-system, SF Pro Text, Segoe UI, Arial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="470"><stop offset="0" stop-color="#0e1330"/><stop offset="1" stop-color="#161033"/></linearGradient>
  </defs>
  <rect width="1000" height="470" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#fff" font-size="26" font-weight="800">Material anatomy — the layer stack</text>
  <text x="40" y="80" fill="#9fb4d8" font-size="15">Six layers composited bottom → top. Refraction is what makes it Liquid Glass, not glassmorphism.</text>

  <!-- exploded stack -->
  <g transform="translate(150,110)">
    <!-- each layer is a skewed parallelogram to look 3D -->
    <g>
      <polygon points="0,300 360,300 460,250 100,250" fill="#2bd6ff" fill-opacity=".22" stroke="#2bd6ff" stroke-opacity=".5"/>
      <text x="470" y="288" fill="#8fe6ff" font-size="14" font-weight="700">1 · Refraction</text>
      <text x="470" y="306" fill="#7f95bd" font-size="12">SVG feDisplacementMap (backdrop-filter)</text>
    </g>
    <g>
      <polygon points="0,250 360,250 460,200 100,200" fill="#7a5cff" fill-opacity=".22" stroke="#7a5cff" stroke-opacity=".5"/>
      <text x="470" y="238" fill="#c3b6ff" font-size="14" font-weight="700">2 · Blur + Saturation</text>
      <text x="470" y="256" fill="#7f95bd" font-size="12">translucency; picks up scene color</text>
    </g>
    <g>
      <polygon points="0,200 360,200 460,150 100,150" fill="#ff5ea8" fill-opacity=".2" stroke="#ff5ea8" stroke-opacity=".5"/>
      <text x="470" y="188" fill="#ff9fce" font-size="14" font-weight="700">3 · Tint</text>
      <text x="470" y="206" fill="#7f95bd" font-size="12">thin hsla wash (keep subtle)</text>
    </g>
    <g>
      <polygon points="0,150 360,150 460,100 100,100" fill="#ffd36e" fill-opacity=".22" stroke="#ffd36e" stroke-opacity=".5"/>
      <text x="470" y="138" fill="#ffe1a0" font-size="14" font-weight="700">4 · Moving specular ::after</text>
      <text x="470" y="156" fill="#7f95bd" font-size="12">tracks pointer / device tilt</text>
    </g>
    <g>
      <polygon points="0,100 360,100 460,50 100,50" fill="#8fffcf" fill-opacity=".22" stroke="#8fffcf" stroke-opacity=".5"/>
      <text x="470" y="88" fill="#aef7d8" font-size="14" font-weight="700">5 · Rim + chromatic ::before</text>
      <text x="470" y="106" fill="#7f95bd" font-size="12">edge highlight + faint dispersion</text>
    </g>
    <g>
      <polygon points="0,50 360,50 460,0 100,0" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".5"/>
      <text x="470" y="38" fill="#fff" font-size="14" font-weight="700">6 · Content + adaptive shadow</text>
      <text x="470" y="56" fill="#7f95bd" font-size="12">text/icons lifted above; depth shadow</text>
    </g>
  </g>
</svg>
