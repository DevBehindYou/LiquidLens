<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset=".5" stop-color="#ff5ea8"/>
      <stop offset="1" stop-color="#2bd6ff"/>
    </linearGradient>
    <radialGradient id="lens" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- app-icon squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- faint background text bent by the "lens" -->
  <g opacity=".22" filter="url(#soft)">
    <circle cx="150" cy="90" r="34" fill="#fff"/>
    <circle cx="96" cy="168" r="26" fill="#fff"/>
  </g>

  <!-- the glass lens droplet -->
  <circle cx="128" cy="128" r="78" fill="url(#lens)"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- specular glint -->
  <ellipse cx="100" cy="98" rx="30" ry="18" fill="#fff" opacity=".55" filter="url(#soft)"/>
  <!-- inner refracted ring -->
  <circle cx="128" cy="128" r="52" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
</svg>
