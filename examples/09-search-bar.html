<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiquidLens — 09 Search Bar</title>
<link rel="stylesheet" href="../packages/core/tokens.css" />
<link rel="stylesheet" href="../packages/core/liquid-glass.css" />
<link rel="stylesheet" href="../assets/demo.css" />
<style>
  .wrap { width: min(520px, 92vw); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 18px; --lg-radius: 999px; }
  .bar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; opacity: .8; flex: 0 0 auto; }
  .bar input {
    flex: 1; background: none; border: none; outline: none; color: var(--lg-fg);
    font: 500 17px/1 var(--lg-font); padding: 14px 0;
  }
  .bar input::placeholder { color: rgba(255,255,255,.55); }
  .bar .go { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; cursor: pointer; }
  .drop { margin-top: 12px; padding: 8px; --lg-radius: 24px; overflow: hidden; transition: opacity .25s, transform .25s var(--lg-ease); }
  .drop.hide { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .res { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 15px; cursor: pointer; transition: background .18s; }
  .res:hover, .res.sel { background: rgba(255,255,255,.14); }
  .res .em { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.12); flex: 0 0 auto; }
  .res .t { flex: 1; min-width: 0; }
  .res .t b { display: block; font-size: 15px; }
  .res .t span { font-size: 12.5px; opacity: .65; }
  .res .k { font-size: 11px; opacity: .5; }
  .empty { padding: 18px 14px; text-align: center; opacity: .6; font-size: 14px; }
</style>
</head>
<body>
  <div class="wallpaper wp-mono"><div class="bg-text"><span>Search</span><span>Find</span></div></div>
  <div class="demo-label">09 · Search Bar</div>

  <div class="center" style="place-items:start center; padding-top:22vh">
    <div class="wrap">
      <div class="lg-glass bar" data-glass data-lg-refraction="20">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" placeholder="Search apps, files and settings…" data-input autocomplete="off" />
        <div class="go" aria-label="dictate">🎙️</div>
      </div>

      <div class="lg-glass drop" data-glass data-drop>
        <div class="list" data-list></div>
      </div>
    </div>
  </div>

  <script src="../packages/core/liquid-glass.js"></script>
  <script>
    LiquidGlass.init({ refraction:18, bezel:22, blur:3 });
    var DATA = [
      ['🧭','Safari','Application','⏎'],
      ['✉️','Mail','Application','⌘M'],
      ['🎵','Music','Application','⌘U'],
      ['🗺️','Maps','Application','⌘L'],
      ['📅','Calendar','Application','⌘C'],
      ['📝','Notes','Application','⌘N'],
      ['⚙️','System Settings','Preferences','⌘,'],
      ['📸','Screenshot.png','Desktop','⏎'],
      ['📁','Design Projects','Folder · Documents','⏎'],
      ['🌇','Coastline Trip','Photo Album','⏎']
    ];
    var input = document.querySelector('[data-input]');
    var drop = document.querySelector('[data-drop]');
    var list = document.querySelector('[data-list]');

    function render(q){
      var items = DATA.filter(function(d){ return !q || d[1].toLowerCase().indexOf(q.toLowerCase()) > -1; });
      if (!items.length){ list.innerHTML = '<div class="empty">No results for “' + q + '”</div>'; return; }
      list.innerHTML = items.map(function(d,i){
        return '<div class="res' + (i===0?' sel':'') + '"><div class="em">' + d[0] + '</div>' +
               '<div class="t"><b>' + d[1] + '</b><span>' + d[2] + '</span></div>' +
               '<div class="k">' + d[3] + '</div></div>';
      }).join('');
    }
    render('');
    input.addEventListener('focus', function(){ drop.classList.remove('hide'); });
    input.addEventListener('input', function(){ drop.classList.remove('hide'); render(input.value.trim()); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ input.blur(); drop.classList.add('hide'); } });
  </script>
</body>
</html>
